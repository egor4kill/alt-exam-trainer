<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Window Header Bar -->
  <rect x="24" y="24" width="464" height="88" rx="96" fill="#1e293b" />
  <rect x="24" y="70" width="464" height="42" fill="#1e293b" />
  <line x1="24" y1="112" x2="488" y2="112" stroke="#334155" stroke-width="2" />

  <!-- Mac / Proxmox Window Dots -->
  <circle cx="76" cy="68" r="14" fill="#ef4444" />
  <circle cx="118" cy="68" r="14" fill="#f59e0b" />
  <circle cx="160" cy="68" r="14" fill="#10b981" />

  <!-- Proxmox / Host Badge -->
  <text x="320" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="1">PROXMOX VE</text>

  <!-- Terminal Content: Prompt '>_' -->
  <!-- Prompt Symbol '>' -->
  <path d="M 110 210 L 220 295 L 110 380" fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Cursor '_' -->
  <rect x="260" y="360" width="120" height="26" rx="12" fill="#10b981" filter="url(#glow)" />

  <!-- Small Alt Linux / Network Badge in corner -->
  <rect x="340" y="405" width="115" height="42" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
  <text x="397" y="433" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">ALT OS</text>
</svg>
